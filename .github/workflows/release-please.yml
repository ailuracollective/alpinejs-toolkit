name: release-please

# Opens one release pull request per changed package and, once that pull request merges, creates the
# git tag and the GitHub release for it. Nothing is published from here: the release only exists
# after the pull request lands on `master`, which keeps version bumps behind the same review and
# policy gates as every other change in this repository.
#
# Publication is handed to `.github/workflows/publish.yml` by the GitHub Release this workflow
# creates: `publish.yml` triggers on `release: published`, one run per released package.
on:
  push:
    branches: [master]

# release-please opens pull requests, writes tags and creates releases, and uses the issues API for
# its labels; upstream documents exactly these three as the required set for the action to run.
permissions:
  contents: write
  issues: write
  pull-requests: write

# One transaction per push: a second push while a run is open would re-plan the same changes, so the
# newer run wins and the older one is dropped.
concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # A personal access token belonging to `AiluraKitty`, not `secrets.GITHUB_TOKEN`.
      #
      # This is not about permissions. Both grants are sufficient to open a release pull request,
      # write a tag and create a release. It is about authorship: release-please creates the commit
      # through the GitHub API, and GitHub attributes both the author and the committer to
      # whichever token made the call. release-please exposes no author configuration and reads no
      # `GIT_COMMITTER_NAME`/`GIT_AUTHOR_*` variable — its only `author`/`committer` options live in
      # the unrelated `code-suggester` module — so the token IS the author setting. With
      # `GITHUB_TOKEN` every release commit is attributed to `github-actions[bot]`; with this
      # secret it is attributed to `AiluraKitty`, and the email follows the token, so the commit
      # links to that account without anything having to configure an address.
      #
      # This token now also gates publication, because `publish.yml` triggers on the GitHub Release
      # this action creates. That coupling is real and is recorded as a known trade: revoking this
      # token stops releases at the tag rather than merely mis-attributing them. It is accepted
      # because the token exists to produce correct authorship, and a release nobody can attribute
      # is not worth having.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
