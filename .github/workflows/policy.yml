name: Contribution policy

# The three published gates, adopted by path at the `v1` tag. Nothing here checks out the code under
# review: these actions read pull request metadata, so the head never reaches a runner holding a token.
# That is also why this workflow has no fork skip, unlike the hub's own self-validation, which must
# run `uses: ./` and therefore does need one.
#
# The hub's own `policy.yml` narrows the type sets to seven (`feat,fix,docs,chore,ci,test,refactor`).
# This repository does not: `.github/labels.yml` declares twelve, and the workflow this file replaces
# enforced all twelve. Narrowing them here would make `style`, `perf`, `build`, `revert` and
# `breaking-change` labels that the manifest sanctions into labels this gate rejects. The values below
# are therefore the action defaults widened to match the manifest, not the reference file's.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-validation:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Reads nothing from the API, so an empty permission set is correct here, not a shortcut.
      - uses: ailuracollective/actions/branch-validation@v1
        with:
          # Eleven, not twelve: `breaking-change` is a label, not a branch segment, and the reference
          # set is the same eleven the previous hand-rolled regex accepted.
          branch-types: feat,fix,chore,docs,style,refactor,perf,test,build,ci,revert
          # `dependabot[bot]` is exempt here as well as below. The reference file exempts dependabot
          # from the PR gate but not from the branch gate, which is unreachable: dependabot's head
          # refs are `dependabot/pnpm/<pkg>-<version>` and carry no type segment, so every one of its
          # pull requests would fail the name check regardless of what the PR gate does.
          #
          # `AiluraKitty` is the account `RELEASE_PLEASE_TOKEN` belongs to, and therefore the author
          # of every pull request release-please opens. Those pull requests cannot pass this gate by
          # construction: their head ref is `release-please--branches--master`, which has no type
          # segment, and their body is a generated changelog with no linked issue. The exemption is
          # safe here because that account is a machine identity — it is not used to open pull
          # requests by hand, so nothing a person wrote is exempted by it.
          skip-actors: 'dependabot[bot], AiluraKitty'

  pull-request-policy:
    name: Pull request policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: ailuracollective/actions/pull-request@v1
        with:
          # Mirrors `.github/labels.yml`. That file is a manifest and is not read by any workflow, so
          # this list and the manifest are two records of the same set: change one, mirror the other.
          type-labels: feat,fix,docs,refactor,chore,style,perf,test,build,ci,revert,breaking-change
          title-min: 15
          title-max: 72
          approved-label: status:approved
          # `AiluraKitty` opens release-please's pull requests. They satisfy none of the five checks
          # here and cannot be made to: no issue is linked, the only label release-please applies is
          # its own `autorelease: pending`, and the body is a generated changelog rather than the
          # template for any type. The action reports an exempt pull request as skipped rather than
          # passed, which is the honest outcome.
          #
          # The exemption covers the whole action, not one check — the action has no per-check or
          # per-label escape hatch. Narrowing it to individual checks is not possible with this
          # action, so the trade is accepted: nothing authored by a person runs through this account.
          skip-actors: 'dependabot[bot], AiluraKitty'

  triage:
    name: Issue triage
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    # The only job that writes, and the only grant of `issues: write` in this repository.
    permissions:
      issues: write
    steps:
      - uses: ailuracollective/actions/triage@v1
        with:
          auto-label-name: status:needs-review
