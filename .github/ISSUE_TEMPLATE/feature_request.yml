name: Feature request
description: Propose a capability, improvement, or API addition for alpinejs-toolkit.
labels: ["enhancement", "status:needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. This form creates a request with the
        `enhancement` and `status:needs-review` labels. A maintainer reviews it and adds
        `status:approved` before any pull request may link it.

        Focus on the problem and the outcome, not on the implementation. A request that
        already specifies a solution tends to be closed faster than one that states the
        need clearly.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      description: Both items are required before this request can be triaged.
      options:
        - label: I searched the existing open and closed issues for this request.
          required: true
        - label: I removed credentials, tokens, and private filesystem paths from this
            request and from any pasted snippets.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is hard, missing, or limiting today? Describe the situation, not the fix.
      placeholder: |
        There is no supported way to share a typed store between two Alpine components
        without duplicating its type definition.
    validations:
      required: true
  - type: textarea
    id: proposed_outcome
    attributes:
      label: Proposed outcome
      description: What becomes possible once this lands? Describe the resulting capability.
      placeholder: |
        A single exported type can be imported by both components, and the compiler
        catches mismatches at build time.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Optional. Workarounds you tried, or approaches you rejected and why.
      placeholder: |
        Considered a shared .d.ts file, but it drifts from the source and CI does not
        check it.
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: |
        Optional. Links to relevant code, issues, discussions already in this repository,
        or prior art, with secrets redacted.
      placeholder: |
        Related: see packages/store/src/types.ts
    validations:
      required: false
